# Snippet: Xtream control plane → PHP-FPM (include inside server { } on Main).
# Media /live|/movie|/series|/timeshift|/play|/auth stays on classic-lb proxy.
# Admin / Next stays on 127.0.0.1:13000 (existing locations).

location = /panel-php/health {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/nexlify-panel-php/health.php;
    fastcgi_pass unix:/run/php/php8.4-fpm-panel.sock;
}

location = /api/internal/live-auth {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/nexlify-panel-php/live-auth.php;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_param HTTP_X_PANEL_INTERNAL_SECRET $http_x_panel_internal_secret;
    fastcgi_pass unix:/run/php/php8.4-fpm-panel.sock;
    fastcgi_read_timeout 10s;
}

# XUI-style extensionless + path aliases → PHP scripts
location = /epg {
    rewrite ^ /epg.php last;
}
location = /playlist {
    rewrite ^ /playlist.php last;
}
location = /player_api {
    rewrite ^ /player_api.php last;
}
location = /panel_api {
    rewrite ^ /panel_api.php last;
}
location = /xmltv {
    rewrite ^ /xmltv.php last;
}
location = /xplugin {
    rewrite ^ /xplugin.php last;
}
location = /progress {
    rewrite ^ /progress.php last;
}
location = /constants {
    rewrite ^ /constants.php last;
}
location = /init {
    rewrite ^ /init.php last;
}

# Path-style subtitle / thumb (XUI clients)
location ~ ^/subtitle/([^/]+)/([^/]+)/([^/]+)/?$ {
    rewrite ^/subtitle/([^/]+)/([^/]+)/([^/]+)/?$ /subtitle.php?username=$1&password=$2&stream=$3 last;
}
location ~ ^/thumb/([^/]+)/([^/]+)/([^/]+)/?$ {
    rewrite ^/thumb/([^/]+)/([^/]+)/([^/]+)/?$ /thumb.php?username=$1&password=$2&stream=$3 last;
}

# streaming/rtmp.php control callback alias
location = /streaming/rtmp.php {
    rewrite ^ /rtmp.php last;
}

location ~ ^/(player_api\.php|panel_api\.php|get\.php|playlist\.php|xmltv\.php|epg\.php|enigma2\.php|probe\.php|subtitle\.php|thumb\.php|api\.php|xplugin\.php|progress\.php|constants\.php|init\.php|rtmp\.php)$ {
    root /var/www/nexlify-panel-php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTPS $https if_not_empty;
    fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    fastcgi_param HTTP_X_FORWARDED_HOST $host;
    fastcgi_param HTTP_X_FORWARDED_PORT $server_port;
    fastcgi_pass unix:/run/php/php8.4-fpm-panel.sock;
    fastcgi_read_timeout 180s;
}
