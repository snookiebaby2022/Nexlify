; Nexlify PHP panel FPM pool (Xtream control plane)
; __PM_*__ filled by scripts/lib/nexlify-capacity.sh at install (50k catalog profile).
[{POOL_NAME}]
user = www-data
group = www-data
listen = /run/php/{PHP_SOCK}
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
listen.backlog = 65535

pm = dynamic
pm.max_children = __PM_MAX_CHILDREN__
pm.start_servers = __PM_START_SERVERS__
pm.min_spare_servers = __PM_MIN_SPARE__
pm.max_spare_servers = __PM_MAX_SPARE__
pm.max_requests = 2000
pm.process_idle_timeout = 10s

request_terminate_timeout = 60s
request_slowlog_timeout = 10s
slowlog = /var/log/php{PHP_VER}-fpm-panel-slow.log

security.limit_extensions = .php
clear_env = no
catch_workers_output = yes

php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
php_admin_flag[expose_php] = off
