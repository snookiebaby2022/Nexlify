; Classic LB — long-lived MPEG-TS (do not share with auth pool)
; __PM_*__ filled by scripts/lib/nexlify-capacity.sh at install (50k profile).
[nexlify-lb-media]
user = www-data
group = www-data
listen = /run/php/php8.4-fpm-lb-media.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
listen.backlog = 65535

pm = dynamic
pm.max_children = __PM_MAX_CHILDREN__
pm.start_servers = __PM_START_SERVERS__
pm.min_spare_servers = __PM_MIN_SPARE__
pm.max_spare_servers = __PM_MAX_SPARE__
pm.max_requests = 200
pm.process_idle_timeout = 30s

request_terminate_timeout = 3600s
request_slowlog_timeout = 30s
slowlog = /var/log/php8.4-fpm-lb-media-slow.log

security.limit_extensions = .php
clear_env = no
catch_workers_output = yes

php_admin_value[memory_limit] = 128M
php_admin_value[max_execution_time] = 3600
php_admin_flag[expose_php] = off
