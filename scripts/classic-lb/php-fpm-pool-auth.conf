; Classic LB — short auth / health / connections export
; __PM_*__ filled by scripts/lib/nexlify-capacity.sh at install (50k profile).
[nexlify-lb-auth]
user = www-data
group = www-data
listen = /run/php/php8.4-fpm-lb-auth.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
listen.backlog = 65535

pm = dynamic
pm.max_children = __PM_MAX_CHILDREN__
pm.start_servers = __PM_START_SERVERS__
pm.min_spare_servers = __PM_MIN_SPARE__
pm.max_spare_servers = __PM_MAX_SPARE__
pm.max_requests = 4000
pm.process_idle_timeout = 8s

request_terminate_timeout = 20s
request_slowlog_timeout = 5s
slowlog = /var/log/php8.4-fpm-lb-auth-slow.log

security.limit_extensions = .php
clear_env = no
catch_workers_output = yes

php_admin_value[memory_limit] = 128M
php_admin_value[max_execution_time] = 20
php_admin_flag[expose_php] = off
