# Included from http{} via conf.d — tuning + upstreams for classic LB.
limit_conn_zone $binary_remote_addr zone=nexlify_perip:20m;
limit_req_zone $binary_remote_addr zone=nexlify_authburst:20m rate=200r/s;

# Short auth/health pool
upstream nexlify_php_auth {
    least_conn;
    server unix:/run/php/php8.4-fpm-lb-auth.sock;
    keepalive 256;
}

# Long-lived mpegts remux pool
upstream nexlify_php_media {
    least_conn;
    server unix:/run/php/php8.4-fpm-lb-media.sock;
    keepalive 128;
}

# Fallback alias (older snippets)
upstream nexlify_php {
    least_conn;
    server unix:/run/php/php8.4-fpm-lb-auth.sock;
    server unix:/run/php/php8.4-fpm-lb-media.sock backup;
    keepalive 64;
}
