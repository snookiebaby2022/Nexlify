# Classic LB - __LISTEN_PORT__ / __HLS_STATIC_PORT__ substituted by install.sh.
# Shared FFmpeg HLS + per-client MPEG-TS remux (no Python fan-out).

server {
    listen 127.0.0.1:__HLS_STATIC_PORT__;
    server_name _;
    access_log off;
    # Localhost-only HLS packager output (blocks public segment theft).
    allow 127.0.0.1;
    deny all;
    location / {
        root /var/lib/nexlify-lb/hls;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
        add_header Cache-Control "no-cache";
        add_header X-Nexlify-LB "classic-ffmpeg-hls" always;
    }
}

server {
    listen __LISTEN_PORT__ reuseport default_server backlog=65535;
    listen [::]:__LISTEN_PORT__ reuseport default_server backlog=65535;
    server_name _;

    root /var/www/nexlify-lb;
    access_log off;
    client_max_body_size 8m;
    send_timeout 3600s;
    keepalive_timeout 65s;
    tcp_nodelay on;
    tcp_nopush off;
    proxy_read_timeout 3600s;
    fastcgi_read_timeout 3600s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    fastcgi_buffering off;
    sendfile on;
    sendfile_max_chunk 512k;

    location = /lb/health {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/nexlify-lb/php/health.php;
        fastcgi_pass nexlify_php_auth;
    }

    location = /lb/connections.json {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/nexlify-lb/php/connections_export.php;
        fastcgi_pass nexlify_php_auth;
    }

    location = /lb/packager-errors.json {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/nexlify-lb/php/packager_errors_export.php;
        fastcgi_pass nexlify_php_auth;
    }

    location = /lb/auth {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/nexlify-lb/php/auth.php;
        fastcgi_param HTTP_X_ORIGINAL_URI $nexlify_auth_uri;
        fastcgi_pass nexlify_php_auth;
        fastcgi_connect_timeout 1s;
        fastcgi_send_timeout 12s;
        fastcgi_read_timeout 12s;
        limit_req zone=nexlify_authburst burst=120 nodelay;
    }

    # XC timeshift: /timeshift/u/p/duration/start/id(.ts|.m3u8)
    location ~ ^/timeshift/([^/]+)/([^/]+)/([^/]+)/([^/]+)/([^/]+)(\.(ts|m3u8))?$ {
        set $nexlify_auth_uri $request_uri;
        auth_request /lb/auth;
        auth_request_set $lb_safe $upstream_http_x_nexlify_safe;
        limit_conn nexlify_perip 256;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/nexlify-lb/php/mpegts.php;
        fastcgi_param QUERY_STRING safe=$lb_safe;
        fastcgi_param HTTP_X_NEXLIFY_SAFE $lb_safe;
        fastcgi_pass nexlify_php_media;
        fastcgi_buffering off;
        fastcgi_keep_conn off;
        gzip off;
    }

    # Signed HLS segments (HMAC) â€” packager files stay on 127.0.0.1:__HLS_STATIC_PORT__.
    location ~ ^/lb/hls/([A-Za-z0-9_-]+)/(seg\d+\.ts)$ {
        limit_conn nexlify_perip 256;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/nexlify-lb/php/hls_segment.php;
        fastcgi_param QUERY_STRING safe=$1&seg=$2&$query_string;
        fastcgi_pass nexlify_php_auth;
        fastcgi_buffering off;
        gzip off;
    }

    # XUI token auth probe: /auth/{token}
    location ~ ^/auth/([A-Za-z0-9._~-]+)/?$ {
        set $nexlify_auth_uri $request_uri;
        auth_request /lb/auth;
        add_header X-Nexlify-LB "classic-token-auth" always;
        return 200;
    }

    # XUI short play URL: /play/{token} (token embeds stream id)
    location ~ ^/play/([A-Za-z0-9._~-]+)(\.(ts|m3u8|mp4))?/?$ {
        set $nexlify_auth_uri $request_uri;
        auth_request /lb/auth;
        auth_request_set $lb_safe $upstream_http_x_nexlify_safe;
        limit_conn nexlify_perip 256;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/nexlify-lb/php/mpegts.php;
        fastcgi_param QUERY_STRING safe=$lb_safe;
        fastcgi_param HTTP_X_NEXLIFY_SAFE $lb_safe;
        fastcgi_pass nexlify_php_media;
        fastcgi_buffering off;
        fastcgi_keep_conn off;
        gzip off;
    }

    # Token live/movie/series: /live/{token}/{id}.ext  (3 path parts after kind)
    location ~ ^/(live|movie|series)/([A-Za-z0-9._~-]+)/([^/]+)\.m3u8$ {
        set $nexlify_auth_uri $request_uri;
        auth_request /lb/auth;
        auth_request_set $lb_safe $upstream_http_x_nexlify_safe;
        limit_conn nexlify_perip 256;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/nexlify-lb/php/hls_playlist.php;
        fastcgi_param QUERY_STRING safe=$lb_safe;
        fastcgi_param HTTP_X_NEXLIFY_SAFE $lb_safe;
        fastcgi_pass nexlify_php_auth;
        fastcgi_buffering off;
    }

    location ~ ^/(live|movie|series)/([A-Za-z0-9._~-]+)/([^/]+)\.ts$ {
        set $nexlify_auth_uri $request_uri;
        auth_request /lb/auth;
        auth_request_set $lb_safe $upstream_http_x_nexlify_safe;
        limit_conn nexlify_perip 256;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/nexlify-lb/php/mpegts.php;
        fastcgi_param QUERY_STRING safe=$lb_safe;
        fastcgi_param HTTP_X_NEXLIFY_SAFE $lb_safe;
        fastcgi_pass nexlify_php_media;
        fastcgi_buffering off;
        fastcgi_keep_conn off;
        gzip off;
    }

    # Username/password live (4 parts) â€” keep after token patterns so u/p still matches
    location ~ ^/(live|movie|series)/([^/]+)/([^/]+)/([^/]+)\.m3u8$ {
        set $nexlify_auth_uri $request_uri;
        auth_request /lb/auth;
        auth_request_set $lb_safe $upstream_http_x_nexlify_safe;
        limit_conn nexlify_perip 256;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/nexlify-lb/php/hls_playlist.php;
        fastcgi_param QUERY_STRING safe=$lb_safe;
        fastcgi_param HTTP_X_NEXLIFY_SAFE $lb_safe;
        fastcgi_pass nexlify_php_auth;
        fastcgi_buffering off;
    }

    location ~ ^/(live|movie|series)/([^/]+)/([^/]+)/([^/]+)/index\.m3u8$ {
        set $nexlify_auth_uri $request_uri;
        auth_request /lb/auth;
        auth_request_set $lb_safe $upstream_http_x_nexlify_safe;
        limit_conn nexlify_perip 256;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/nexlify-lb/php/hls_playlist.php;
        fastcgi_param QUERY_STRING safe=$lb_safe;
        fastcgi_param HTTP_X_NEXLIFY_SAFE $lb_safe;
        fastcgi_pass nexlify_php_auth;
        fastcgi_buffering off;
    }

    location ~ ^/(live|movie|series)/([^/]+)/([^/]+)/([^/]+)\.ts$ {
        set $nexlify_auth_uri $request_uri;
        auth_request /lb/auth;
        auth_request_set $lb_safe $upstream_http_x_nexlify_safe;
        limit_conn nexlify_perip 256;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/nexlify-lb/php/mpegts.php;
        fastcgi_param QUERY_STRING safe=$lb_safe;
        fastcgi_param HTTP_X_NEXLIFY_SAFE $lb_safe;
        fastcgi_pass nexlify_php_media;
        fastcgi_buffering off;
        fastcgi_keep_conn off;
        gzip off;
    }

    # Extensionless + .mp4 VOD (u/p/id) and token/id
    location ~ ^/(live|movie|series)/([^/]+)/([^/]+)/([^/]+)(\.mp4)?/?$ {
        set $nexlify_auth_uri $request_uri;
        auth_request /lb/auth;
        auth_request_set $lb_safe $upstream_http_x_nexlify_safe;
        limit_conn nexlify_perip 256;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/nexlify-lb/php/mpegts.php;
        fastcgi_param QUERY_STRING safe=$lb_safe;
        fastcgi_param HTTP_X_NEXLIFY_SAFE $lb_safe;
        fastcgi_pass nexlify_php_media;
        fastcgi_buffering off;
        fastcgi_keep_conn off;
        gzip off;
    }

    location ~ ^/(live|movie|series)/([A-Za-z0-9._~-]+)/([^/]+)(\.mp4)?/?$ {
        set $nexlify_auth_uri $request_uri;
        auth_request /lb/auth;
        auth_request_set $lb_safe $upstream_http_x_nexlify_safe;
        limit_conn nexlify_perip 256;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/nexlify-lb/php/mpegts.php;
        fastcgi_param QUERY_STRING safe=$lb_safe;
        fastcgi_param HTTP_X_NEXLIFY_SAFE $lb_safe;
        fastcgi_pass nexlify_php_media;
        fastcgi_buffering off;
        fastcgi_keep_conn off;
        gzip off;
    }

    location / {
        return 404;
    }
}
