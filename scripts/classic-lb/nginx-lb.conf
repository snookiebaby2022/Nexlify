# Classic LB — __LISTEN_PORT__ / __HLS_STATIC_PORT__ substituted by install.sh.
# Shared FFmpeg HLS + per-client MPEG-TS remux (no Python fan-out).

server {
    listen 127.0.0.1:__HLS_STATIC_PORT__;
    server_name _;
    access_log off;
    location / {
        root /var/lib/nexlify-lb/hls;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
        add_header Cache-Control "no-cache";
        add_header X-Nexlify-LB "classic-ffmpeg-hls" always;
    }
}

server {
    listen __LISTEN_PORT__ reuseport default_server;
    listen [::]:__LISTEN_PORT__ reuseport default_server;
    server_name _;

    root /var/www/nexlify-lb;
    access_log off;
    client_max_body_size 8m;
    send_timeout 3600s;
    proxy_read_timeout 3600s;
    fastcgi_read_timeout 3600s;

    location = /lb/health {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/nexlify-lb/php/health.php;
        fastcgi_pass nexlify_php;
    }

    location = /lb/connections.json {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/nexlify-lb/php/connections_export.php;
        fastcgi_pass nexlify_php;
    }

    location = /lb/auth {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/nexlify-lb/php/auth.php;
        fastcgi_param HTTP_X_ORIGINAL_URI $nexlify_auth_uri;
        fastcgi_pass nexlify_php;
        fastcgi_connect_timeout 2s;
        fastcgi_send_timeout 20s;
        fastcgi_read_timeout 20s;
        limit_req zone=nexlify_authburst burst=80 nodelay;
    }

    location ~ ^/(live|movie|series|timeshift)/([^/]+)/([^/]+)/([^/]+)\.m3u8$ {
        set $nexlify_auth_uri $request_uri;
        auth_request /lb/auth;
        auth_request_set $lb_safe $upstream_http_x_nexlify_safe;
        limit_conn nexlify_perip 32;
        proxy_pass http://127.0.0.1:__HLS_STATIC_PORT__/$lb_safe/index.m3u8;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location ~ ^/(live|movie|series|timeshift)/([^/]+)/([^/]+)/([^/]+)/index\.m3u8$ {
        set $nexlify_auth_uri $request_uri;
        auth_request /lb/auth;
        auth_request_set $lb_safe $upstream_http_x_nexlify_safe;
        limit_conn nexlify_perip 32;
        proxy_pass http://127.0.0.1:__HLS_STATIC_PORT__/$lb_safe/index.m3u8;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # Continuous MPEG-TS — fastcgi after auth (content phase; $lb_safe is valid here)
    location ~ ^/(live|movie|series|timeshift)/([^/]+)/([^/]+)/([^/]+)\.ts$ {
        set $nexlify_auth_uri $request_uri;
        auth_request /lb/auth;
        auth_request_set $lb_safe $upstream_http_x_nexlify_safe;
        limit_conn nexlify_perip 16;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/nexlify-lb/php/mpegts.php;
        fastcgi_param QUERY_STRING safe=$lb_safe;
        fastcgi_param HTTP_X_NEXLIFY_SAFE $lb_safe;
        fastcgi_pass nexlify_php;
        fastcgi_buffering off;
        fastcgi_keep_conn off;
        gzip off;
    }

    location ~ ^/(live|movie|series|timeshift)/([^/]+)/([^/]+)/([^/]+)/?$ {
        set $nexlify_auth_uri $request_uri;
        auth_request /lb/auth;
        auth_request_set $lb_safe $upstream_http_x_nexlify_safe;
        limit_conn nexlify_perip 16;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/nexlify-lb/php/mpegts.php;
        fastcgi_param QUERY_STRING safe=$lb_safe;
        fastcgi_param HTTP_X_NEXLIFY_SAFE $lb_safe;
        fastcgi_pass nexlify_php;
        fastcgi_buffering off;
        fastcgi_keep_conn off;
        gzip off;
    }

    location / {
        return 404;
    }
}
